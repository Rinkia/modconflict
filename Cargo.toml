[package]
name = "modconflict"
version = "0.1.0"
edition = "2021"
description = "Scan a game mod folder and report conflicts before the game crashes"
license = "MIT"
repository = "https://github.com/Rinkia/modconflict"

[features]
# Record-level conflict detection for Creation Engine games.
#
# On by default because it is a headline feature — but it pulls in `esplugin`,
# which is GPL-3.0, and a binary linking it must be distributed under GPL-3.0.
# Build with `--no-default-features` for a binary that is MIT throughout.
# See THIRD-PARTY-NOTICES.md.
default = ["records"]
records = ["dep:esplugin"]
# Exposes the internal untrusted-input parsers (`value`, `limits`) so the
# fuzz harnesses in fuzz/ can hit them directly. Off in every normal build;
# never part of the stable API.
fuzzing = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
roxmltree = "0.20"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
ba2 = "3.0.1"
vpk = "0.3.0"
unpak = "1.0.5"
esplugin = { version = "6.1.4", optional = true }
larian-formats = "0.8.1"
blake3 = "1.8.5"
globset = "0.4"
jsonc-parser = { version = "0.26", features = ["serde"] }
rust-ini = "0.21"
# A container packed inside a .zip is extracted to a temp file before the
# path-based readers can open it (see scan::read_archive).
tempfile = "3"
