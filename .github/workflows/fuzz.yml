name: Fuzz

# Fuzzing is slow and needs nightly, so it runs on a schedule and on demand,
# not on every PR. The per-PR safety net is the deterministic mutation test in
# the main suite (hostile::mutation); this is the exploratory complement.
on:
  schedule:
    # Mondays at 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to run each target"
        default: "120"

jobs:
  fuzz:
    name: fuzz / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [value_json, value_xml, value_toml]
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }}
        run: >
          cargo fuzz run ${{ matrix.target }}
          --
          -max_total_time=${{ github.event.inputs.seconds || '120' }}
          -rss_limit_mb=4096

      # A crash leaves an input in fuzz/artifacts/; keep it so the failure is
      # reproducible instead of just red.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
